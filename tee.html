<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEE 기반 코인 지갑 아키텍처</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fdfcf8;color:#2b2a26;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
svg text{font-family:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 22px 6px;flex-wrap:wrap;flex:none}
h1{font-size:22px;margin:0;font-weight:750;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{font:inherit;font-size:14px;font-weight:650;padding:7px 16px;border-radius:999px;border:1.4px solid #c9c4b6;background:#fff;color:#7a766c;cursor:pointer}
.tabs button[aria-selected=true]{background:#2b2a26;border-color:#2b2a26;color:#fdfcf8}
.legend{display:flex;gap:6px 14px;font-size:12.5px;color:#7a766c;width:100%;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:22px;height:0;border-radius:0;border-top:2px solid #2b2a26;vertical-align:3px}
.legend i.hyp{border-top-style:dashed}
.legend .sep{margin-left:auto}
.deck{display:flex;width:400vw;flex:1;min-height:0;transition:transform .35s ease}
.deck section{width:100vw;height:100%;padding:4px 14px 12px}
.deck svg{width:100%;height:100%}
.tip{cursor:help;outline:none}
.tip:hover>rect,.tip:focus-visible>rect{filter:drop-shadow(0 2px 6px rgba(43,42,38,.25))}
.tip:hover>circle:nth-of-type(2),.tip:focus-visible>circle:nth-of-type(2){filter:drop-shadow(0 0 4px rgba(43,42,38,.55))}
#tt{position:fixed;left:0;top:0;z-index:10;max-width:330px;padding:10px 13px;border-radius:10px;background:#2b2a26;color:#fdfcf8;font-size:13px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .12s;word-break:keep-all;overflow-wrap:anywhere}
#tt.on{opacity:1}
#tt b{display:block;font-size:13.5px;margin-bottom:3px}
#tt em{font-style:normal;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:7px;vertical-align:1px}
#tt em.ok{background:#4f7f52;color:#fff}
#tt em.hyp{border:1px dashed #c9c4b6;color:#e9e4d6}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8"></path></marker>
</defs></svg>
<header><h1 id="ttl">가입 시 키 생성과 보관</h1>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-i="0">가입</button><button role="tab" aria-selected="false" data-i="1">서명</button><button role="tab" aria-selected="false" data-i="2">내보내기</button><button role="tab" aria-selected="false" data-i="3">인증값</button></div>
<div class="legend"><span><i style="background:#b8862b"></i>authValue</span><span><i style="background:#4a6f8f"></i>암호문</span><span><i style="background:#b5483a"></i>개인키 평문</span><span><i style="background:#4f7f52"></i>보안 영역</span><span class="sep"><i class="ln"></i>실선·채운 번호 = 앱 코드에서 확인</span><span><i class="ln hyp"></i>점선·빈 번호 = 가설</span></div></header>
<div class="deck" id="deck"><section><svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가입 시 키 생성과 보관 흐름"><rect x="30" y="56" width="300" height="636" rx="14" fill="none" stroke="#c9c4b6" stroke-width="1.5"></rect><g transform="translate(44,68) scale(0.9167)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></g><text x="74" y="85" font-size="15" fill="#2b2a26" font-weight="700" text-anchor="start">고객 단말</text><rect x="480" y="56" width="890" height="616" rx="14" fill="none" stroke="#c9c4b6" stroke-width="1.5"></rect><g transform="translate(494,68) scale(0.9167)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"></rect><path d="M7.5 7.25h.01M7.5 16.75h.01"></path></g><text x="524" y="85" font-size="15" fill="#2b2a26" font-weight="700" text-anchor="start">토스 서버</text><rect x="500" y="104" width="240" height="546" rx="10" fill="#f8f6ef" stroke="none"></rect><text x="514" y="126" font-size="13" fill="#7a766c" font-weight="600" text-anchor="start">백엔드</text><g class="tip" tabindex="0" data-title="지갑 UI" data-st="가설" data-tip="가입 화면은 앱이 아니라 웹 화면에 따로 있는 것으로 추정된다. 앱 코드에서 가입 화면 자체는 확인되지 않았다."><rect x="70" y="150" width="220" height="56" rx="8" fill="#fff" stroke="#c9c4b6" stroke-width="1.4"></rect><g transform="translate(84,166.0) scale(1)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><path d="M3 9h18"></path></g><text x="120" y="174.5" font-size="15" fill="#2b2a26" font-weight="650" text-anchor="start">지갑 UI</text><text x="120" y="193.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">지갑 만들기 · 웹 화면(가설)</text></g><g class="tip" tabindex="0" data-title="Wallet SDK" data-st="확인" data-tip="앱 안의 지갑 코드. authValue를 준비하고(없으면 생성) 서버 공개키로 감싸 보낸다. &#x27;Wallet SDK&#x27;는 이 그림에서 붙인 이름이다."><rect x="70" y="240" width="220" height="70" rx="8" fill="#fff" stroke="#c9c4b6" stroke-width="1.4"></rect><g transform="translate(84,263.0) scale(1)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"></path></g><text x="120" y="271.5" font-size="15" fill="#2b2a26" font-weight="650" text-anchor="start">Wallet SDK</text><text x="120" y="290.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">authValue 준비 · 암호화</text></g><g class="tip" tabindex="0" data-title="앱 인증" data-st="확인" data-tip="토스 공통 앱 인증. 인증 결과로 얻은 hashedPassword가 authValue를 잠그는 2차 키의 재료가 된다."><rect x="70" y="350" width="220" height="56" rx="8" fill="#fff" stroke="#c9c4b6" stroke-width="1.4"></rect><g transform="translate(84,366.0) scale(1)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 10a5.5 5.5 0 0 1 11 0v2.5"></path><path d="M9.5 19.5c-.8-2-1-4-1-7V10a3.5 3.5 0 0 1 7 0v3c0 2.2.3 4 .8 5.5"></path><path d="M12 10v3.5c0 2.5.4 4.6 1 6"></path></g><text x="120" y="374.5" font-size="15" fill="#2b2a26" font-weight="650" text-anchor="start">앱 인증</text><text x="120" y="393.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">비밀번호 유래 키</text></g><g class="tip" tabindex="0" data-title="기기 보안 저장소" data-st="확인" data-tip="authValue를 이중 암호화해 보관하는 곳. 1차는 AndroidKeyStore AES-256 키, 2차는 PBKDF2 비밀번호 파생 키다. 자세한 흐름은 &#x27;인증값&#x27; 탭에 있다."><rect x="55" y="450" width="250" height="220" rx="14" fill="#f4f8f1" stroke="#4f7f52" stroke-width="1.5"></rect><g transform="translate(69,462) scale(0.9167)" fill="none" stroke="#4f7f52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></g><text x="99" y="479" font-size="15" fill="#4f7f52" font-weight="700" text-anchor="start">기기 보안 저장소</text></g><text x="180" y="648" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="middle">보안 저장소 키 + 비밀번호 유래 키</text><g class="tip" tabindex="0" data-title="authValue" data-st="확인" data-tip="앱이 SecureRandom으로 만든 32바이트(256비트) 난수. 온체인 개인키가 아니라 서버의 지갑 기능을 쓰기 위한 인증 비밀값이다. 저장할 때는 이중 암호화한다. 먼저 AndroidKeyStore AES-256 키로, 그 결과를 다시 비밀번호 파생 키(PBKDF2 60만 회)로 암호화한다."><rect x="70" y="540" width="220" height="60" rx="8" fill="#fff" stroke="#b8862b" stroke-width="1.8"></rect><g transform="translate(84,558.0) scale(1)" fill="none" stroke="#b8862b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.5"></circle><path d="M11.5 12H21M17.5 12v3M20.5 12v2"></path></g><text x="120" y="566.5" font-size="15" fill="#b8862b" font-weight="650" text-anchor="start">authValue</text><text x="120" y="585.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">32바이트 난수 · 이중 암호화</text></g><g class="tip" tabindex="0" data-title="DB" data-st="가설" data-tip="서버가 암호화된 개인키와 주소를 저장한다는 추정이다. 서버 내부 저장 방식은 APK로 확인할 수 없다."><rect x="520" y="140" width="200" height="56" rx="8" fill="#fff" stroke="#4a6f8f" stroke-width="1.8" stroke-dasharray="6 4"></rect><g transform="translate(534,156.0) scale(1)" fill="none" stroke="#4a6f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="2.8"></ellipse><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"></path></g><text x="570" y="164.5" font-size="15" fill="#4a6f8f" font-weight="650" text-anchor="start">DB</text><text x="570" y="183.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">Enc(개인키) · 주소</text></g><g class="tip" tabindex="0" data-title="지갑 백엔드" data-st="확인" data-tip="앱이 통신하는 유일한 상대(/api/v3/bc-wallet-backend). 가입 요청을 TEE로 중계한다는 부분은 가설이다."><rect x="510" y="245" width="220" height="100" rx="8" fill="#fff" stroke="#c9c4b6" stroke-width="1.4"></rect><g transform="translate(524,283.0) scale(1)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"></path><path d="M9 12l2.2 2.2L15.2 10"></path></g><text x="560" y="283.0" font-size="15" fill="#2b2a26" font-weight="650" text-anchor="start">지갑 백엔드</text><text x="560" y="302.0" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">bc-wallet-backend</text><text x="560" y="319.0" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">생성 요청 중계 (가설)</text></g><rect x="512" y="400" width="216" height="88" rx="8" fill="#fbf6e6" stroke="#e3d8b4" stroke-width="1.2"></rect><text x="526" y="422" font-size="12.5" fill="#2b2a26" font-weight="700" text-anchor="start">확인된 범위</text><text x="526" y="442" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">authValue 로컬 생성·저장,</text><text x="526" y="460" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">서버의 공개키 제공까지.</text><text x="526" y="478" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">그 밖의 가입 흐름은 추정</text><g class="tip" tabindex="0" data-title="TEE" data-st="가설" data-tip="개인키 내보내기 코드의 AAD 문자열 bc-tee-kms/privkey-export/v2 하나에서 나온 가설이다. 서버가 실제로 TEE를 쓰는지는 APK로 확인할 수 없다."><rect x="900" y="104" width="440" height="380" rx="14" fill="#f4f8f1" stroke="#4f7f52" stroke-width="1.5" stroke-dasharray="6 4"></rect><g transform="translate(914,116) scale(0.9167)" fill="none" stroke="#4f7f52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"></rect><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"></path></g><text x="944" y="133" font-size="15" fill="#4f7f52" font-weight="700" text-anchor="start">TEE</text><text x="990" y="133" font-size="12.5" fill="#7a766c" font-weight= ="middle">5</text></g><text x="1150" y="527" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">attestation 일치 시 Decrypt</text><rect x="755" y="520" width="260" height="106" rx="8" fill="#fbf6e6" stroke="#e3d8b4" stroke-width="1.2"></rect><text x="769" y="542" font-size="12.5" fill="#2b2a26" font-weight="700" text-anchor="start">TEE 근거는 이 경로뿐</text><text x="769" y="562" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">AAD 문자열이 TEE 가설의 유일한</text><text x="769" y="580" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">근거. 일반 출금이 같은 장치를</text><text x="769" y="598" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">쓴다는 증거는 아님. 내보내기가</text><text x="769" y="616" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">있으므로 개인키는 TEE 밖으로 나감</text><path d="M250 176 L250 218" fill="none" stroke="#2b2a26" stroke-width="1.6" marker-end="url(#ah)"></path><g class="tip" tabindex="0" data-title="1단계" data-st="확인" data-tip="본인 확인 후 개인키 보기로 들어간다."><circle cx="274" cy="197" r="16" fill="transparent"></circle><circle cx="274" cy="197" r="11" fill="#2b2a26"></circle><text x="274" y="201.5" font-size="12.5" fill="#fdfcf8" font-weight="700" text-anchor="middle">1</text></g><path d="M290 248 L508 248" fill="none" stroke="#2b2a26" stroke-width="1.6" marker-end="url(#ah)"></path><g class="tip" tabindex="0" data-title="2단계" data-st="확인" data-tip="export 요청과 함께 임시 RSA 공개키를 보낸다."><circle cx="405" cy="248" r="16" fill="transparent"></circle><circle cx="405" cy="248" r="11" fill="#2b2a26"></circle><text x="405" y="252.5" font-size="12.5" fill="#fdfcf8" font-weight="700" text-anchor="middle">2</text></g><text x="405" y="208" font-size="13" fill="#2b2a26" font-weight="600" text-anchor="middle">export 요청</text><text x="405" y="226" font-size="13" fill="#2b2a26" font-weight="600" text-anchor="middle">임시 RSA 공개키</text><path d="M620 196 L620 223" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#ah)" stro  font-weight="700" text-anchor="middle">7</text></g><text x="405" y="356" font-size="13" fill="#4a6f8f" font-weight="600" text-anchor="middle">RSA-OAEP(AES 키)</text><text x="405" y="374" font-size="13" fill="#4a6f8f" font-weight="600" text-anchor="middle">AES-GCM(개인키)</text><path d="M250 356 L250 418" fill="none" stroke="#b5483a" stroke-width="1.6" marker-end="url(#ah)"></path><g class="tip" tabindex="0" data-title="8단계" data-st="확인" data-tip="복호화한 개인키 평문을 화면에 표시한다."><circle cx="274" cy="387" r="16" fill="transparent"></circle><circle cx="274" cy="387" r="11" fill="#2b2a26"></circle><text x="274" y="391.5" font-size="12.5" fill="#fdfcf8" font-weight="700" text-anchor="middle">8</text></g></svg></section><section><svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="authValue 로컬 보호 흐름"><text x="30" y="38" font-size="15" fill="#2b2a26" font-weight="700" text-anchor="start">만들 때 (ENSURE / RECOVER)</text><g class="tip" tabindex="0" data-title="토스 앱 메모리" data-st="확인" data-tip="토스 앱 프로세스의 일반 메모리. authValue 평문이 존재하는 유일한 곳이다."><rect x="30" y="56" width="390" height="636" rx="14" fill="none" stroke="#c9c4b6" stroke-width="1.5"></rect><g transform="translate(44,68) scale(0.9167)" fill="none" stroke="#2b2a26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></g><text x="74" y="85" font-size="15" fill="#2b2a26" font-weight="700" text-anchor="start">토스 앱 메모리</text></g><g class="tip" tabindex="0" data-title="authValue 생성" data-st="확인" data-tip="SecureRandom으로 32바이트(256비트) 난수를 만든다. 값이 없거나 손상됐을 때만 새로 만들고, 유효한 기존 값은 재사용한다."><rect x="60" y="110" width="330" height="60" rx="8" fill="#fff" stroke="#b8862b" stroke-width="1.8"></rect><text x="78" y="136.5" font-size="15" fill="#b8862b" font-weight="650" text-anchor="start">authValue 생성</text><text x="78" y="155.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">SecureRandom · 32바이트 평문</text></g><g class="tip" tabindex="0" data-title="1차 암호문" data-st="확인" data-tip="Keystore의 AES-256 키로 GCM 암호화한 결과다."><rect x="60" y="230" width="330" height="60" rx="8" fill="#fff" stroke="#4a6f8f" stroke-width="1.8"></rect><text x="78" y="256.5" font-size="15" fill="#4a6f8f" font-weight="650" text-anchor="start">1차 암호문</text><text x="78" y="275.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">Keystore 키로 AES-GCM</text></g><g class="tip" tabindex="0" data-title="비밀번호 파생 키" data-st="확인" data-tip="hashedPassword와 salt를 PBKDF2-HMAC-SHA256으로 600,000회 돌려 만든 32바이트 키다."><rect x="60" y="350" width="330" height="60" rx="8" fill="#fff" stroke="#c9c4b6" stroke-width="1.4"></rect><text x="78" y="376.5" font-size="15" fill="#2b2a26" font-weight="650" text-anchor="start">비밀번호 파생 키</text><text x="78" y="395.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">hashedPassword + salt · PBKDF2 60만 회</text></g><g class="tip" tabindex="0" data-title="2차 암호문" data-st="확인" data-tip="1차 암호문을 파생 키로 한 번 더 GCM 암호화한 결과(ProtectedAuthValueBlob)다."><rect x="60" y="470" width="330" height="60" rx="8" fill="#fff" stroke="#4a6f8f" stroke-width="1.8"></rect><text x="78" y="496.5" font-size="15" fill="#4a6f8f" font-weight="650" text-anchor="start">2차 암호문</text><text x="78" y="515.5" font-size="12.5" fill="#7a766c" font-weight="500" text-anchor="start">파생 키로 한 번 더 AES-GCM</text></g><g class="tip" tabindex="0" data-title="이중 암호화" data-st="확인" data-tip="하나의 authValue에 암호화를 두 번 차례로 적용한다. 1차는 기기 Keystore의 AES-256 키, 2차는 hashedPassword에서 만든 파생 키이며 둘 다 AES-GCM이다. 풀 때는 역순이고 두 키가 모두 있어야 한다. 보고서는 이를 값을 둘로 쪼개는 키 분할(MPC)이 아니라 보호 계층의 결합이라고 적었다. 왜 두 겹인지는 보고서에 없다."><rect x="60" y="575" width="330" height="88" rx="8" fill="#fbf6e6" stroke="#e3d8b4" stroke-width="1.2"></rect><text x="74" y="597" font-size="12.5" fill="#2b2a26" font-weight="700" text-anchor="start">이중 암호화</text><text x="74" y="617" font-size="12" fill="#5d5a52" font-weight="500" text-anchor="start">1차 Keysto <div id="tt" role="tooltip"></div>
<script>
const T=["가입 시 키 생성과 보관","출금 서명 경로","개인키 내보내기 경로","authValue 로컬 보호"],deck=document.getElementById("deck"),tabs=[...document.querySelectorAll(".tabs button")];let cur=0;
function go(i){cur=Math.max(0,Math.min(T.length-1,i));deck.style.transform="translateX("+(-cur*100)+"vw)";document.getElementById("ttl").textContent=T[cur];tabs.forEach((b,k)=>b.setAttribute("aria-selected",k===cur));}
tabs.forEach(b=>b.onclick=()=>go(+b.dataset.i));
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
let sx=null;addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)go(cur+(d<0?1:-1));sx=null;});
const h=parseInt(location.hash.slice(1),10);if(h)go(h-1);
const tt=document.getElementById("tt");let tipEl=null;
function place(x,y){const r=tt.getBoundingClientRect();let l=x+14,t=y+18;if(l+r.width>innerWidth-8)l=x-r.width-14;if(t+r.height>innerHeight-8)t=y-r.height-12;tt.style.left=Math.max(8,l)+"px";tt.style.top=Math.max(8,t)+"px";}
function showTip(el,x,y){if(el!==tipEl){tipEl=el;tt.textContent="";const b=document.createElement("b");b.textContent=el.dataset.title;const em=document.createElement("em");em.textContent=el.dataset.st;em.className=el.dataset.st==="확인"?"ok":"hyp";b.appendChild(em);tt.append(b,el.dataset.tip);tt.classList.add("on");}place(x,y);}
function hideTip(){tipEl=null;tt.classList.remove("on");}
deck.addEventListener("mousemove",e=>{const el=e.target.closest(".tip");el?showTip(el,e.clientX,e.clientY):hideTip();});
deck.addEventListener("mouseleave",hideTip);
deck.addEventListener("focusin",e=>{const el=e.target.closest(".tip");if(el&&el.matches(":focus-visible")){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.bottom-8);}});
deck.addEventListener("focusout",hideTip);
addEventListener("keydown",e=>{if(e.key==="Escape"||e.key.startsWith("Arrow"))hideTip();});
tabs.forEach(b=>b.addEventListener("click",hideTip));
</script></body></html>
